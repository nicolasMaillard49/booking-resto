<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"></head>
<body style="font-family: Inter, system-ui, sans-serif; color: #1a1a1a; max-width: 560px; margin: 0 auto; padding: 24px;">
  <h1 style="font-family: Georgia, serif; font-size: 24px;">{{brandName}} — Admin</h1>
  <h2>Nouveau message de contact</h2>
  <p><strong>De :</strong> {{name}} &lt;{{email}}&gt;</p>
  <p style="white-space: pre-line; padding: 12px; background: #f5f5f5; border-left: 3px solid #8B6F47;">{{message}}</p>
  <p style="color: #888; font-size: 12px;">Répondez directement à <a href="mailto:{{email}}">{{email}}</a>.</p>
</body>
</html>
